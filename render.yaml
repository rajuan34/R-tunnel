# Render Blueprint Specification for R-Tunnel
# Deploy instantly by linking your GitHub repository to Render
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: r-tunnel
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      # Secure credentials automatically generated by Render on initial deployment
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: TUNNEL_MASTER_TOKEN
        generateValue: true
      # Operational Limits
      - key: MAX_ACTIVE_TUNNELS
        value: "10"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "120"
      - key: MAX_BODY_SIZE
        value: "10mb"
      - key: MAX_WS_MESSAGE_SIZE
        value: "12mb"
      - key: DEFAULT_TUNNEL_DURATION
        value: "1h"
      - key: MAX_TUNNEL_DURATION
        value: "3h"
      - key: LOG_LEVEL
        value: "info"
      # Set to "true" if you wish to enable the 12-min health self-ping loop on free tier
      - key: KEEP_ALIVE
        value: "false"
