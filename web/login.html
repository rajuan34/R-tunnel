<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — R-Tunnel</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%), #090d16;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">R</div>
      <div class="brand-text">
        <h1 style="font-size: 20px;">R-Tunnel</h1>
        <span>Admin Dashboard</span>
      </div>
    </div>

    <h2 style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px;">Sign In</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Enter your administrator credentials to access the tunnel control panel.</p>

    <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 18px;"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" required autocomplete="username" value="admin">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
        Sign In to Dashboard
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-dim); text-align: center;">
      Configured via Render Environment Variables<br>
      <code style="font-family: var(--font-mono); color: #94a3b8;">ADMIN_USERNAME / ADMIN_PASSWORD</code>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { setCsrfToken, showToast } from '/js/common.js';

    // If already logged in, redirect
    fetch('/api/auth/me')
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          window.location.replace('/dashboard');
        }
      })
      .catch(() => {});

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();
        if (res.ok && data.success) {
          if (data.csrfToken) setCsrfToken(data.csrfToken);
          window.location.replace('/dashboard');
        } else {
          errorEl.textContent = data.error || 'Invalid username or password.';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = 'Unable to reach the server. Please check your connection.';
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
