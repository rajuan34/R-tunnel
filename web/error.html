<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — R-Tunnel</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background-color: #090d16;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 36px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
      color: #f8fafc;
      font-weight: 700;
    }
    p {
      margin: 0 0 20px 0;
      line-height: 1.6;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404 NOT FOUND</div>
    <h1>Resource Not Found</h1>
    <p>The requested page, API endpoint, or tunnel path was not found on this server.</p>
    <a href="/dashboard" class="btn btn-primary" style="display: inline-block; text-decoration: none;">Return to Dashboard</a>
  </div>
</body>
</html>
